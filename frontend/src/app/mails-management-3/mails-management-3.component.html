<div class="loader-container" *ngIf="isLoading">
  <div class="loader"></div>
</div>

<div data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">

  <app-user-header></app-user-header>

  <div class="gradient_color">
    <h3>Step 3</h3>
  </div>

  <section class="step_1_section step_2_section">
    <div class="container">
      <div class="step_1_form step_2_form">
        <form [formGroup]="formData" (ngSubmit)="onSubmit()">
          <!-- Company Documents Section -->
          <div class="item">
            <h3>Company Documents</h3>
          
            <!-- Company Trade License Text Input -->
            <div class="form-field">
              <label for="companyTradeLicenseNumber">Enter Company Trade License Number<span class="required">*</span></label>
              <input
                class="form-control"
                type="text"
                id="companyTradeLicenseNumber"
                placeholder="Enter Company Trade License Number"
                formControlName="companyTradeLicenseNumber"
              />
              <div *ngIf="formData.get('companyTradeLicenseNumber')?.invalid && formData.get('companyTradeLicenseNumber')?.touched" class="error-message">
                Company Trade License is required.
              </div>
            </div>
          
            <!-- Company Trade License File Upload -->
            <div class="form-field">
              <label for="companyTradeLicenseFile">
                Upload Trade License <span class="required">*</span>
              </label>
              <div class="custom-file-upload">
                <input
                  type="text"
                  class="form-control rounded-input"
                  readonly
                  [value]="companyTradeLicenseFile?.[0]?.name || 'No file chosen'"
                  placeholder="No file chosen"
                  (click)="triggerFileUpload()"
                />
                <label class="upload-button" for="companyTradeLicenseFile">
                  <i class="fa fa-upload"></i>
                </label>
                <input
                  type="file"
                  id="companyTradeLicenseFile"
                  (change)="onFileChangeTrade($event)"
                  #fileInput
                  style="display: none;"
                />
              </div>
            
              <!-- Display file name and a "View File" link if the file array is not empty -->
              <ul class="view-file" *ngIf="companyTradeLicenseFile?.length">
                <li *ngFor="let file of companyTradeLicenseFile">
                  {{ file.name }}
                  <a
                    [href]="file.url"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    View File
                  </a>
                </li>
              </ul>
            </div>
            
            
          </div>
          
          
  
          <!-- Shareholder Details Section -->
          <div class="item" formArrayName="shareholders">
            <h3>Shareholder Details</h3>
            <div *ngFor="let shareholder of shareholders.controls; let i = index" [formGroupName]="i" class="shareholder-section">
              <div class="shareholder-row">
                
                <!-- Passport Number Field -->
                <div class="form-field">
                  <label for="passportNumber">Enter ID or Passport Number for Shareholder {{ i + 1 }}<span class="required">*</span></label>
                  <input type="text" class="form-control" formControlName="passportNumber" placeholder="Enter Passport Number" />
                  <div *ngIf="shareholder.get('passportNumber')?.invalid && shareholder.get('passportNumber')?.touched" class="error-message">
                    Passport Number is required.
                  </div>
                </div>
  
                <!-- File Upload Field for Shareholder -->
                <div class="form-field">
                  <label for="files">File Upload for Shareholder {{ i + 1 }}<span class="required">*</span></label>
                  <div class="custom-file-upload">
                    <input
                      type="text"
                      class="form-control rounded-input"
                      readonly
                      [value]="uploadedFileNames[i]?.[0]?.name || 'No file chosen'"
                      placeholder="No file chosen"
                      (click)="triggerFileUpload2(i)"
                    />
                    <label class="upload-button" for="files{{ i }}">
                      <i class="fa fa-upload"></i>
                    </label>
                    <input
                      type="file"
                      id="files{{ i }}"
                      multiple
                      #fileInput2
                      (change)="onFileChange($event, i)"
                      style="display: none;"
                    />
                  </div>
                
                  <!-- Display the uploaded file names and "View File" links -->
                  <ul class="view-file">
                    <li *ngFor="let file of uploadedFileNames[i]">
                      {{ file.name }}
                      <a [href]="file.url" target="_blank" rel="noopener noreferrer">View File</a>
                    </li>
                  </ul>
                
                  <div *ngIf="!uploadedFiles[i]?.length && shareholder.get('files')?.touched" class="error-message">
                    Please upload  file.
                  </div>
                </div>
                
              </div>
            </div>
          </div>
  
          <!-- Submit Button -->
          <div class="form-submit">
            <button type="submit" class="btn" id="btn_submit">Next</button>
          </div>
  
        </form>
      </div>
    </div>
  </section>
  

  <app-footer></app-footer>


</div>
