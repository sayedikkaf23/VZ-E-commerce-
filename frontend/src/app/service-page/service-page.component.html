<div class="container mx-auto p-4">
    <h2 class="text-2xl font-semibold mb-4">Service List</h2>
  
    <!-- Table to display services -->
    <table class="min-w-full bg-white border border-gray-200">
      <thead>
        <tr class="bg-gray-100">
          <th class="px-4 py-2 text-left">Service Name</th>
          <th class="px-4 py-2 text-left">Description</th>
          <th class="px-4 py-2 text-left">Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Iterate over services to display data -->
        <tr *ngFor="let service of services">
          <td class="px-4 py-2 border-b">{{ service.name }}</td>
          <td class="px-4 py-2 border-b">{{ service.description }}</td>
          <td class="px-4 py-2 border-b">{{ service.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
