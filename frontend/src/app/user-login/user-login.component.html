<div class="login-page">
  <div class="login-tag">BeYour<br />OwnBoss</div>
  <div class="login-content">
    <div class="logo">
      <a href="#">
        <img
          src="https://res.cloudinary.com/dvekmmxxx/image/upload/v1718347384/photo_2024-06-14_11-46-14-removebg-preview_bml8en.png"
          alt="Logo"
          class="d-block"
        />
      </a>
    </div>
    <h2>Sign In to Your <br />Account</h2>
    <p>Welcome Back! Sign in with your data entered during registration.</p>
    <div class="login-label">
      <span>LOGIN WITH EMAIL</span>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="form-field">
        <input
          style="width: 100%;"
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Email address"
        />
      </div>

      <div class="form-field mt-3">
        <input
          style="width: 100%;"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Password"
        />
      </div>

      <div class="form-check mt-3">
        <input
          class="form-check-input"
          type="checkbox"
          value=""
          id="rememberMe"
        />
        <label class="form-check-label" for="rememberMe">Keep me logged in</label>
      </div>

      <button
        type="submit"
        style="color: #ffffff !important; background-color: #ff0000;"
        class="btn w-100 mt-4"
      >
        LOGIN
      </button>
    </form>
  </div>
</div>
