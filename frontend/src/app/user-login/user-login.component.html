<section class="login_section">
    <div class="wrapper position-relative">
      <div class="logo">
        <img src="assets/customer_protal/images/logo.svg" alt="" class="d-md-block d-none">
      </div>
      <div class="row align-items-center g-lg-0 g-md-4 g-0 h-100">
        <div class="col-md-6 position-relative h-100 order-md-0 order-1">
          <div class="image">
            <picture>
              <source media="(max-width: 767px)" srcset="images/login_img_sm.jpg">
              <img loading="lazy" src="assets/customer_protal/images/login_img.jpg" alt="Prime Services" title="Prime Services">
            </picture>
            <h1>#BeYourOwnBoss</h1>
          </div>
        </div>
        <div class="col-md-6 h-100">
          <div class="form_wrp">
            <h2>Sign In to <br class="d-none d-md-block"> Your Account</h2>
            <p>Welcome Back! Sign in with your credentials.</p>
            <form [formGroup]="loginForm" (ngSubmit)="submit()">
              <div class="form-field">
                <input type="email" class="form-control" formControlName="email" placeholder="Email address" required>
              </div>
              <div class="form-field password">
                <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" formControlName="password" placeholder="Password" required>
                <div class="icon" (click)="togglePasswordVisibility()">
                  <svg *ngIf="!passwordVisible" class="pass-show" width="21" height="15">
                    <path d="M19.5765 6.61321C19.8588 7.00906 19.9999 7.20704 19.9999 7.5C19.9999 7.79296 19.8588 7.99094 19.5765 8.38679C18.3079 10.1656 15.0684 14 10.7142 14C6.35991 14 3.12042 10.1656 1.85193 8.38679C1.56962 7.99094 1.42847 7.79296 1.42847 7.5C1.42847 7.20704 1.56962 7.00906 1.85193 6.61321C3.12042 4.83448 6.35991 1 10.7142 1C15.0684 1 18.3079 4.83448 19.5765 6.61321Z" stroke="currentColor" stroke-width="1.3"/>
                  </svg>
                  <svg *ngIf="passwordVisible" class="pass-hide" width="19" height="19">
                    <path d="M2 1L20 19" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="row align-items-center justify-content-between">
                <div class="col-auto">
                  <div class="form-check mb-0">
                    <input type="checkbox" class="form-check-input" id="keeplogged">
                    <label class="form-check-label" for="keeplogged">Keep me logged in</label>
                  </div>
                </div>
                <div class="col-auto">
                  <a href="#" class="link"><u>Forgot Password?</u></a>
                </div>
              </div>
              <button type="submit" class="btn w-100">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
