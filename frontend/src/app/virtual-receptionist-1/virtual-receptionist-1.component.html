<div data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">
    <app-user-header></app-user-header>
  
    <div class="gradient_color">
      <h3>Step 3</h3>
    </div>

    <section class="step_1_section step_2_section">
        <div class="container">
            <div class="step_1_form step_2_form">
                <form (ngSubmit)="onSubmit()" [formGroup]="companyDetailsForm" enctype="multipart/form-data">
                  <div class="item">
                    <h3>Company Details</h3>
                  </div>
                   <div class="form-field" >
                    <label for="companyname">Company Name<span class="required">*</span></label>
                    <input
                      class="form-control"
                      type="text"
                      id="companyname"
                      placeholder="Enter your Company's name"
                      formControlName = "companyName"
                    />
                  </div>

                  <div class="form-field" *ngIf="companyLocation.length > 0">
                    <fieldset>
                        <label for="companyLocation">Where is your Company Incorporated?<span class="required">*</span>
                        </label>
                        <select class="form-select" name="selectedLocation" formControlName="selectedLocation">
                          <option value="" disabled selected>
                            Company Location</option>
                          <option *ngFor=" let location of companyLocation" [value]="">
                            {{ location }}
                          </option>
                        </select>
                    </fieldset>
                  </div>

                        <div *ngIf="selectedLocationControl?.value === 'United Arab Emirates'">
                          <div class="form-field"  required >
                            
                              <label for="companyLicensed">Where is your Company licensed?<span class="required">*</span></label>
                              <div style="display: flex;">
                                <label  for="freezone">Freezone</label>
                                <input style="margin-left: 15px;" type="radio" id="freezone" name="small-checkbox" value="freezone" formControlName="companyLicensed">
                                <label  style="margin-left: 45px;" for="mainland">Mainland</label>
                                <input style="margin-left: 15px;" type="radio" id="mainland" name="small-checkbox" value="mainland" formControlName="companyLicensed">
                                
                              </div>
                            
                          </div>
                          <div class="form-field" >
                            <fieldset>
                              <label for="companywebsite">Enter Company your Website(if applicable)</label>
                              <input
                                class="form-control"
                                type="text"
                                id="companywebsite"
                                placeholder="Enter your Company's website URL"
                                formControlName = "companyWebsite"
                              />
                            </fieldset>
                          </div>
      
                          <div class="form-field">
                            <fieldset>
                              <label for="activityType">What are the type of activities mentioned on your trade license?<span class="required">*</span></label>
                              <select class="form-select" name="activityType" formControlName="activityType" >
                                <option value="" disabled selected>
                                  Select the appropriate option</option>
                                <option value="Commercial">Commercial</option>
                                <option value="Professional">Professional</option>
                                <option value="Industrial">Industrial</option>
                                <option value="Tourism">Tourism</option>
                              </select>
                            </fieldset>
                          </div>
      
                          <div class="form-field">
                            <fieldset>
                              <label for="totalShareholders">How many shareholders does your company have?<span class="required">*</span></label>
                              <select
                                name="shareholder"
                                id="shareholder"
                                class="form-select"
                                formControlName="totalShareholders"
                              >
                                <option value="" disabled selected>
                                    How many shareholder does your company have?<span class="required">*</span>
                                </option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10+">10</option>
                              </select>
                            </fieldset>
                          </div>
      
                          <div class="shareholder-row" *ngIf="showShareholderList">
                            <h3 style="margin-bottom: 30px;">Shareholder List</h3>
                            <div class="form-group shareholder-details" *ngFor="let shareholder of shareholders; let i = index">
                              <div class="form-field">
                                <label>Full Name <span class="required">*</span></label>
                                <input type="text" formControlName="name"  required placeholder="Full Name" />
                              </div>
                              <div class="form-field">
                                <label>Phone Number <span class="required">*</span></label>
                                <input type="text" formControlName="phone"  required placeholder="Phone Number" />
                              </div>
                              <div class="form-field">
                                <label>Date of Birth <span class="required">*</span></label>
                                <input  type="date" formControlName="dob"  required />
                              </div>
                              <div class="form-field">
                                <label>Nationality <span class="required">*</span></label>
                                <select class="form-select" name="nationality" formControlName="nationality">
                                  <option value="" disabled selected>
                                    Nationality</option>
                                  <option *ngFor=" let nationality of companyLocation" [value]="">
                                    {{ nationality }}
                                  </option>
                                </select>                       
                               </div>
      
                              <!-- <div class="additem" (click)="addShareholder()">
                                <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="29.5" cy="29.5" r="29.5" fill="#FA2E52" />
                                    <line x1="29.5938" y1="17" x2="29.5938" y2="42" stroke="white" stroke-width="1.5" />
                                    <line x1="42" y1="29.5938" x2="17" y2="29.5937" stroke="white" stroke-width="1.5" />
                                </svg>
                              </div> -->
                            
                            </div>
            
                          </div>
                          
                          
                        </div>

                  <div *ngIf="selectedLocationControl?.valid && selectedLocationControl?.value !== 'United Arab Emirates'">
                  
                    <div class="form-field" >
                      <fieldset>
                        <label for="companywebsite">Enter Company your Website(if applicable)</label>
                        <input
                          class="form-control"
                          type="text"
                          id="companywebsite"
                          placeholder="Enter your Company's website URL"
                          formControlName = "companyWebsite"
                        />
                      </fieldset>
                    </div>

                    <div class="form-field">
                      <label for="activityType">What are the type of activities mentioned on your trade license?<span class="required">*</span></label>
                    <input
                      class="form-control"
                      type="text"
                      id="activitytype"
                      placeholder="Enter your Activity type"
                      formControlName = "activityType"
                    />
                    </div>

                    <div class="form-field">
                      <fieldset>
                        <label for="totalShareholders">How many shareholders does your company have?<span class="required">*</span></label>
                        <select
                          name="shareholder"
                          id="shareholder"
                          class="form-select"
                          formControlName="totalShareholders"
                        >
                          <option value="" disabled selected>
                              How many shareholder does your company have?<span class="required">*</span>
                          </option>
                          <option value="1">1</option>
                          <option value="2">2</option>
                          <option value="3">3</option>
                          <option value="4">4</option>
                          <option value="5">5</option>
                          <option value="6">6</option>
                          <option value="7">7</option>
                          <option value="8">8</option>
                          <option value="9">9</option>
                          <option value="10+">10</option>
                        </select>
                      </fieldset>
                    </div>

                    <div class="shareholder-row" *ngIf="showShareholderList">
                      <h3 style="margin-bottom: 30px;">Shareholder List</h3>
                      <div class="form-group shareholder-details" *ngFor="let shareholder of shareholders; let i = index">
                        <div class="form-field">
                          <label>Full Name <span class="required">*</span></label>
                          <input type="text" formControlName="name"  required placeholder="Full Name" />
                        </div>
                        <div class="form-field">
                          <label>Phone Number <span class="required">*</span></label>
                          <input type="text" formControlName="phone"  required placeholder="Phone Number" />
                        </div>
                        <div class="form-field">
                          <label>Date of Birth <span class="required">*</span></label>
                          <input  type="date" formControlName="dob"  required />
                        </div>
                        <div class="form-field">
                          <label>Nationality <span class="required">*</span></label>
                          <select class="form-select" name="nationality" formControlName="nationality">
                            <option value="" disabled selected>
                              Nationality</option>
                            <option *ngFor=" let nationality of companyLocation" [value]="">
                              {{ nationality }}
                            </option>
                          </select>                       
                         </div>

                        <!-- <div class="additem" (click)="addShareholder()">
                          <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                              <circle cx="29.5" cy="29.5" r="29.5" fill="#FA2E52" />
                              <line x1="29.5938" y1="17" x2="29.5938" y2="42" stroke="white" stroke-width="1.5" />
                              <line x1="42" y1="29.5938" x2="17" y2="29.5937" stroke="white" stroke-width="1.5" />
                          </svg>
                        </div> -->
                      
                      </div>
      
                    </div>

                  </div>

                  
                    
                  

                  <div class="form-submit">
                    <button type="submit" class="btn" id="btn_submit">Next</button>
                  </div>

                </form>
            </div>            
        </div>
    </section>

    <app-footer></app-footer>
  
    <div
      class="modal fade searchbox"
      id="searchmodal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
          <div class="modal-body">
            <form action="" class="mb-0">
              <input type="text" class="form-control" placeholder="Search here" />
              <span class="btn-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 30 30"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g clip-path="url(#clip0_9_9)">

                      d="M5.625 12.1875C5.625 14.877 6.49805 17.3613 7.96875 19.377L0.550781 26.8008C-0.181641 27.5332 -0.181641 28.7227 0.550781 29.4551C1.2832 30.1875 2.47266 30.1875 3.20508 29.4551L10.623 22.0313C12.6387 23.5078 15.123 24.375 17.8125 24.375C24.5449 24.375 30 18.9199 30 12.1875C30 5.45508 24.5449 0 17.8125 0C11.0801 0 5.625 5.45508 5.625 12.1875ZM17.8125 20.625C16.7045 20.625 15.6073 20.4068 14.5836 19.9827C13.5599 19.5587 12.6298 18.9372 11.8463 18.1537C11.0628 17.3702 10.4413 16.4401 10.0173 15.4164C9.59324 14.3927 9.375 13.2955 9.375 12.1875C9.375 11.0795 9.59324 9.98229 10.0173 8.95861C10.4413 7.93492 11.0628 7.00478 11.8463 6.22129C12.6298 5.43779 13.5599 4.81629 14.5836 4.39227C15.6073 3.96824 16.7045 3.75 17.8125 3.75C18.9205 3.75 20.0177 3.96824 21.0414 4.39227C22.0651 4.81629 22.9952 5.43779 23.7787 6.22129C24.5622 7.00478 25.1837 7.93492 25.6077 8.95861C26.0318 9.98229 26.25 11.0795 26.25 12.1875C26.25 13.2955 26.0318 14.3927 25.6077 15.4164C25.1837 16.4401 24.5622 17.3702 23.7787 18.1537C22.9952 18.9372 22.0651 19.5587 21.0414 19.9827C20.0177 20.4068 18.9205 20.625 17.8125 20.625Z"

                    />

                  <defs>
                    <clipPath id="clip0_9_9">
                      <rect
                        width="30"

                        transform="matrix(-1 0 0 1 30 0)"
                      />
                    </clipPath>
                  </defs>
                </svg>
              </span>
            </form>
          </div>
        </div>
      </div>
    </div>

</div>
