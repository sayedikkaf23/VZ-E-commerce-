<div data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">

    <app-user-header></app-user-header>

    <div class="gradient_color">
        <h3>Step 2</h3>
    </div>

    <section class="step_1_section step_2_section">
        <div class="container">
           
            <div class="step_1_form step_2_form">
                <form>
                    <div class="item">
                        <h3>Enter Additional Details</h3>
                        <div class="form-field" >
                            <label for="companyname">Enter Company Trade License<span class="required">*</span></label>
                            <input
                              class="form-control"
                              type="text"
                              id="companytradelicense"
                              placeholder="Enter Company Trade License"
                              formControlName = "companytradelicense"
                            />
                          </div>

                          <div class="form-field" >
                            <label for="companyname">Enter Shareholder ID's/Passport <span class="required">*</span></label>
                            <input
                              class="form-control"
                              type="text"
                              id="shareholderid"
                              placeholder="Enter Shareholder ID's/Passport"
                              formControlName = "shareholderid"
                            />
                          </div>



        </div>
                      
                    <div class="item">
                        <h3>Upload Documents</h3>
                        <div class="accordion-item">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                data-bs-target="#passport_upload">
                                Upload Passport Copy
                            </button>
                            <div id="passport_upload" class="accordion-collapse collapse">
                                <div class="accordion-body">
                                    <div class="form-field m-0">
                                        <fieldset>
                                            <div class="file_upload">
                                                <label for="passport" class="form-label m-0">Drag and drop to
                                                    upload</label>
                                                <input class="form-control" id="passport" type="file">
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>
                            </div>
                        </div>
                       
                        <div class="form-submit">
                            <button type="submit" class="btn" id="btn_submit">Upload and pay</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <app-footer></app-footer>

  
</div>
