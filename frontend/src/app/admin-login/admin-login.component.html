<div class="login-page">
    <div class="login-tag">
      BeYour<br />
      OwnBoss
    </div>
    <div class="login-content">
      <div class="logo">
        <a href="javascript:void(0)">
          <img src="assets/images/vz_logo.png" alt="" class="d-block" />
        </a>
      </div>
      <h2>Sign In to Your <br />Account</h2>
      <p>
        Welcome Back! Sign in with your data that <br />you entered during
        registration.
      </p>
      <div class="login-label">
        <span>LOGIN WITH EMAIL</span>
      </div>
      <form [formGroup]="loginForm" (ngSubmit)="submit()">
        <div class="form-field">
          <input
          style="width: 100%; max-width: 400px;"
          type="email"
            class="form-control"
            formControlName="email"
            placeholder="Email address"
          />
        </div>
      
        <div class="form-field" style="position: relative;">
          <input
            style="width: 100%;"
            [type]="passwordVisible ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="Password"
          />
          <span class="eye-icon" (click)="togglePasswordVisibility()" >
            <i class="fas" [ngClass]="passwordVisible ?  'fa-eye' : 'fa-eye-slash' "></i>
          </span>
        </div>
      
        <div class="row align-items-center justify-content-between">
          <div class="col-auto">
            <div class="form-check remember-me">
              <input class="form-check-input" type="checkbox" id="flexCheckDefault" />
              <label class="form-check-label" for="flexCheckDefault">
                Keep me logged in
              </label>
            </div>
            
          </div>
        </div>
      
        <div style="text-align: center;">
          <button class="btn w-100 mt-3" style="max-width: 400px; width: 100%; background-color: red; color: #fff;">
            LOGIN
          </button>
        </div>
        
      </form>

      </div> -->
    </div>
  
  </div>
