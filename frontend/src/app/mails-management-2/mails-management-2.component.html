<div data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">
  <app-user-header></app-user-header>

  <div class="gradient_color">
    <h3>Step 2 - Let’s get to know you more!</h3>
  </div>

  <section class="step_1_section step_2_section">
    <div class="container">
      <!-- <div class="head_text">
        <h3 style="font-size: 20px" data-aos="fade-up">
          Let’s get to know you more!
        </h3>
        <p data-aos="fade-up">Virtuzone offers a range of services to further enhance your business well-being.
                  </p>

      <div class="step_1_form step_2_form">
        <form (ngSubmit)="onSubmit()" enctype="multipart/form-data">
          <div class="item">
            <h3>Company Details</h3>

            <div class="form-field">
              <label for="CompanyName">Company Name? <span
                  class="required">*</span></label>

              <input type="text" name="CompanyName" id="CompanyName" class="form-input"
                [(ngModel)]="formData.CompanyName" placeholder="Company Name" />
            </div>
            <div class="form-field">
              <div class="form-field">
                <label for="CompanyIncorporated">Where is your Company Incorporated? <span class="required">*</span></label>

                <fieldset>
                  <select class="form-select" id="CompanyIncorporated" [(ngModel)]="formData.CompanyIncorporated" style="border-color: transparent;"
                      [ngModelOptions]="{ standalone: true }" >
                      <option value="" disabled>Select Country</option>
                      <option *ngFor="let nationality of nationalities" [value]="nationality">
                          {{ nationality }}
                      </option>
                  </select>
                </fieldset>
              </div>
            </div>
            <div class="form-field" *ngIf="formData.CompanyIncorporated == 'United Arab Emirates'">
              <label for="resident">Where is your Company licensed? <span class="required">*</span></label>

              <fieldset>
                <select name="Companylicensed" id="Companylicensed" class="form-select" [(ngModel)]="formData.Companylicensed">
                  <option value="" disabled selected>
                    Where is your Company licensed?
                  </option>
                  <option value="Mainland">Mainland</option>
                  <option value="Freezone">Freezone</option>
                </select>
              </fieldset>
            </div>

            <div class="form-field" *ngIf="formData.CompanyIncorporated == 'United Arab Emirates'">
              <label for="tradelicense">What are the type of activities mentioned on your trade license?: <span class="required">*</span></label>
              <fieldset>
                <select name="tradelicense" id="tradelicense" class="form-select" [(ngModel)]="formData.tradelicense">
                  <option value="" disabled selected>Select  Trade license</option>
                  <!-- Options specific to each licensing type -->
                  <!-- <option  value="Commercial License">Commercial License</option>
                  <option  value="Professional License">Professional License</option>
                  <option  value="Industrial License">Industrial License</option>
                  <option  value="Tourism License">Tourism License</option> -->

                   <!-- New Options -->
                  <option value="Communications and broadcasting">Communications and broadcasting</option>
                  <option value="Video and audio recordings">Video and audio recordings</option>
                  <option value="Passenger transportation and car rental">Passenger transportation and car rental</option>
                  <option value="Brokerage business">Brokerage business</option>
                  <option value="Trading and distribution of different products">Trading and distribution of different products</option>
                  <option value="Theaters and cinemas">Theaters and cinemas</option>
                  <option value="Facility administration">Facility administration</option>
                  <option value="Rental services">Rental services</option>
                  <option value="Postal service">Postal service</option>
                  <option value="Buying and selling livestock">Buying and selling livestock</option>
                  <option value="Investment">Investment</option>
                  <option value="Insurance">Insurance</option>
                  <option value="Rental of office spaces and electronic equipment">Rental of office spaces and electronic equipment</option>
                  <option value="Perfumery">Perfumery</option>
                  <option value="Services for packing">Services for packing</option>
                  <option value="Property investment">Property investment</option>
                  <option value="Motor vehicle and motorcycle trading">Motor vehicle and motorcycle trading</option>
                  <option value="Cleaning and surveillance services">Cleaning and surveillance services</option>
                  <option value="Supermarket and stores">Supermarket and stores</option>
                  <option value="Manufacturing">Manufacturing</option>
                  <option value="Machines and appliances">Machines and appliances</option>
                  <option value="Food processing">Food processing</option>
                  <option value="Woodworking and wood products">Woodworking and wood products</option>
                  <option value="Steel fabrication">Steel fabrication</option>
                  <option value="Generation/Transmission of electricity">Generation/Transmission of electricity</option>
                  <option value="Fabrication of textiles and products">Fabrication of textiles and products</option>
                  <option value="Production of petroleum products">Production of petroleum products</option>
                  <option value="Motorcycles and replacement parts">Motorcycles and replacement parts</option>
                  <option value="Chemical manufacturing">Chemical manufacturing</option>
                  <option value="Gold and precious stone cutting">Gold and precious stone cutting</option>
                  <option value="Garment and rug">Garment and rug</option>
                  <option value="Ship construction">Ship construction</option>
                  <option value="Waste collection and disposal">Waste collection and disposal</option>
                  <option value="Plastics manufacturing">Plastics manufacturing</option>
                  <option value="Glass repair and lens cutting">Glass repair and lens cutting</option>
                  <option value="Eyeglasses production">Eyeglasses production</option>
                  <option value="Leather products manufacturing">Leather products manufacturing</option>
                  <option value="Paper products manufacturing">Paper products manufacturing</option>
                  <option value="Accounting and finance consultancy">Accounting and finance consultancy</option>
                  <option value="Agriculture and soil consultancy">Agriculture and soil consultancy</option>
                  <option value="Animal welfare society">Animal welfare society</option>
                  <option value="Forum of businesspeople">Forum of businesspeople</option>
                  <option value="Also, the business advisory council">Business advisory council</option>
                  <option value="Management consultancy">Management consultancy</option>
                  <option value="Facilities management organization">Facilities management organization</option>
                  <option value="Marketing and information">Marketing and information</option>
                  <option value="Hospitals and rehab facilities">Hospitals and rehab facilities</option>
                  <option value="Insurance consultancy">Insurance consultancy</option>
                  <option value="Beauty salons">Beauty salons</option>
                  <option value="Legal assistance">Legal assistance</option>
                  <option value="Translation and typing">Translation and typing</option>
                  <option value="Representative offices">Representative offices</option>
                  <option value="Social clubs and activities for social work">Social clubs and activities for social work</option>
                </select>
              </fieldset>
            </div>
            <div class="form-field" *ngIf="formData.CompanyIncorporated">
              <label for="Website">Enter Company Website (if applicable)
                 </label>

              <input type="text" name="Website" id="Website" class="form-input"
                [(ngModel)]="formData.Website" placeholder="Company Website" />
            </div>
            <div class="form-field" *ngIf="formData.CompanyIncorporated !== 'United Arab Emirates' && formData.CompanyIncorporated">
              <label for="tradelicense">What are the types of activities mentioned on your trade license?
                <span class="required">*</span>
              </label>
            
              <input type="text" name="tradelicense" id="tradelicense" class="form-input"
                [(ngModel)]="formData.tradelicense" placeholder="Trade license" />
            </div>
            
            <!-- <div class="form-field">
                <fieldset>
                  <select
                    name="working"
                    id="working"
                    class="form-select"
                    [(ngModel)]="formData.working"
                  >
                    <option value="" disabled>
                        which jurisdiction is your company located it ?<span class="required"
                        >*</span
                      >
                    </option>
                    <option value="Salaried">Salaried</option>
                    <option value="Self Employed">Self-Employed</option>
                  </select>
                </fieldset>
              </div> -->
        

            <div class="form-field" *ngIf="formData.CompanyIncorporated">
              <label for="resident">How many shareholders does your company have?
                <span class="required">*</span></label>
                <fieldset>
                  <select name="shareholdercount" id="shareholdercount" class="form-select" style="border-color: transparent;"
                    [(ngModel)]="formData.shareholdercount" (ngModelChange)="updateShareholders()">
                    <option value="" disabled selected>
                      How many shareholders does your company have?
                    </option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10+">10+</option>
                  </select>
                </fieldset>
                
            </div>
          
            <div class="shareholder-row shareholder-section" *ngIf="formData.CompanyIncorporated"> <!-- Apply new class here -->
              <h3 style="margin-bottom: 30px;">Shareholders List</h3>
              <div class="form-group shareholder-details" *ngFor="let shareholder of shareholders; let i = index">
                <div class="shareholder-inputs"> <!-- Flex container for alignment -->
                  <div class="form-field ">

                    <label class="shareholder-label">Full Name <span class="required">*</span></label>
                    <input type="text" [(ngModel)]="shareholder.name" [ngModelOptions]="{ standalone: true }" required
                      placeholder="Full Name" style="padding: 25px;" data-ui-tooltip title="{{ shareholder.name }}" />
                    <!-- Tooltip showing the full value -->

                  </div>
                  <div class="form-field">
                    <label class="shareholder-label">Shareholder %<span class="required">*</span></label>
                    <!-- Apply new class here -->
                    <input type="number" [(ngModel)]="shareholder.shareholderPercentage"
                      [ngModelOptions]="{ standalone: true }" required placeholder="Shareholder %" min="0" max="100"
                      style="padding: 25px" />
                  </div>
                  <div class="form-field">
                    <label class="shareholder-label">Date of Birth <span class="required">*</span></label>
                    <!-- Apply new class here -->
                    <input type="date" [(ngModel)]="shareholder.dob" [ngModelOptions]="{ standalone: true }" required
                      style="padding: 25px"  (keydown)="preventManualInput($event)" 
                      (click)="openDatePicker($event)" [ngClass]="{ 'filled-input': shareholder.dob, 'placeholder-input': !shareholder.dob }" />
                  </div>
                  <div class="form-field">
                    <label class="shareholder-label">Nationality <span class="required">*</span></label>
                    <!-- Apply new class here -->
                    <select class="form-select" [(ngModel)]="shareholder.nationalityshareholder" [ngModelOptions]="{ standalone: true }" style="border-color: transparent;">
                      <option value="" disabled [ngValue]="null">Select Nationality</option>
                      <option *ngFor="let nationality of nationalitiesData" [value]="nationality">{{ nationality }}</option>
                    </select>
                    
                  </div>




                  <span (click)="deleteShareholder(i)" class="remove-icon">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                      <path d="M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                  </span>

                  <!-- Remove button -->
                </div>
              </div>
              <div *ngIf="shareholders.length < formData.shareholdercount" class="additem" (click)="addShareholder()">
                <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="29.5" cy="29.5" r="29.5" fill="#FA2E52" />
                  <line x1="29.5938" y1="17" x2="29.5938" y2="42" stroke="white" stroke-width="1.5" />
                  <line x1="42" y1="29.5938" x2="17" y2="29.5937" stroke="white" stroke-width="1.5" />
                </svg>
              </div>
            </div>



          </div>

          <div class="form-submit">
            <button type="submit" class="btn" id="btn_submit">Next</button>
          </div>

          <div class="item">
            <!--                   
                        <div class="form-field">
                          <label for="emirates-id">Emirates ID (If applicable)</label>
                          <input class="form-control" type="text" id="emirates-id" name="emirates-id" [(ngModel)]="formData.emiratesId" placeholder="ID" />
                        </div> -->

            <!-- <div class="accordion-item">
                          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#salary_statements">
                            Upload your salary statement (past 3 months)
                          </button>
                          <div id="salary_statements" class="accordion-collapse collapse">
                            <div class="accordion-body">
                              <div class="form-field m-0">
                                <fieldset>
                                  <div class="file_upload">
                                    <label for="salarystatement" class="form-label m-0">Drag and drop to upload</label>
                                    <input class="form-control" name="salaryStatements" id="salarystatement" type="file" multiple (change)="onFileChange($event, 'salaryStatements')" />
                                  </div>
                                </fieldset>
                              </div>
                            </div>
                          </div>
                        </div> -->
          </div>
        </form>
      </div>
    </div>
  </section>

  <app-footer></app-footer>

  <div class="modal fade searchbox" id="searchmodal" tabindex="-1" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">

        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

            <input type="text" class="form-control" placeholder="Search here" />

            </span>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
