<div class="container-fluid p-0">
  <div class="row g-0">
    <!-- Sidebar Column -->
    <div class="col-auto">
      <div
        class="admin-sidebar"
        data-simplebar
        style="
          background-image: url('https://res.cloudinary.com/dvekmmxxx/image/upload/v1734931889/sidebar-bg_zg78mh.jpg');
        "
      >
        <div class="row justify-content-between sidebar-row gx-0">
          <div class="row justify-content-between gx-0 align-items-center">
            <div class="col-auto">
              <div class="logo text-center">
                <a href="#">
                  <img src="assets/images/logo-white.svg" alt="" class="d-block" />
                </a>
              </div>
            </div>
            <div class="col-auto d-lg-none">
              <div class="navbar-toggle">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <div class="col-auto">
            <div class="sidebarnav">
              <ul>
                <li class="active">
                  <a>
                    <span class="icon">
                      <img src="assets/images/sidebarnav-icon/4.svg" />
                    </span>
                    Service
                  </a>
                </li>
              </ul>
              <ul>
                <li>
                  <a>
                    <span class="icon">
                      <img src="assets/images/sidebarnav-icon/9.svg" />
                    </span>
                    Setting
                  </a>
                </li>
                <li>
                  <a href="#">
                    <span class="icon">
                      <img src="assets/images/sidebarnav-icon/10.svg" />
                    </span>
                    Help Center
                  </a>
                </li>
              </ul>
            </div>
          </div>
          <div class="col-auto">
            <h2>#BeYour<br />OwnBoss</h2>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content Column -->
    <div class="col" style="background-color: #f8f9fa;">
      <div
        class="admin-body-content"
        style="padding: 1rem; overflow: auto; margin-left: 0;"
      >
        <!-- Header -->
        <div
          class="admin-header"
          style="background-color: #f8f9fa; padding: 0.5rem 1rem; border-bottom: 1px solid #ddd;"
        >
          <div class="row align-items-center justify-content-between">
            <!-- Title -->
            <div class="col-auto d-none d-md-block">
              <h3 style="margin: 0; font-size: 18px; font-weight: bold;">Services</h3>
            </div>
          </div>
        </div>

        <!-- Table Section -->
        <div
          class="table-responsive"
          style="
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            margin-top: 20px;
          "
        >
          <table
            class="table table-bordered table-hover"
            style="
              width: 100%;
              margin: 0;
              border-collapse: collapse;
              font-size: 14px;
            "
          >
            <thead style="background-color: #f1f1f1;">
              <tr>
                <th style="text-align: center; padding: 8px; font-weight: bold;">
                  Services Name
                </th>
                <th style="text-align: center; padding: 8px; font-weight: bold;">
                  Account Name
                </th>
                <th style="text-align: center; padding: 8px; font-weight: bold;">
                  Tax Invoice
                </th>
                <th style="text-align: center; padding: 8px; font-weight: bold;">
                  Tax Invoice Date
                </th>
                <th style="text-align: center; padding: 8px; font-weight: bold;">
                  Amount
                </th>
                <th style="text-align: center; padding: 8px; font-weight: bold;">
                  Product
                </th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let card of customerCards">
                <td style="text-align: center; padding: 6px;">{{ card.holder_name }}</td>
                <td style="text-align: center; padding: 6px;">*******{{ card.last_number }}</td>
                <td style="text-align: center; padding: 6px;">{{ card.tax_invoice }}</td>
                <td style="text-align: center; padding: 6px;">{{ card.tax_invoice_date }}</td>
                <td style="text-align: center; padding: 6px;">{{ card.amount }}</td>
                <td style="text-align: center; padding: 6px;">{{ card.product }}</td>
              </tr>
              <tr *ngIf="customerCards.length === 0">
                <td
                  colspan="6"
                  style="
                    text-align: center;
                    padding: 6px;
                    color: #888;
                    font-style: italic;
                  "
                >
                  No records available.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
