<div class="content">
  <div class="page-heading" style=" margin: 20px; margin-top: 25px;">

    <div class="row align-items-center justify-content-between">
      <div class="col-auto">
        <div class="row align-items-center">
          <div class="col-auto mb-2">
            <h2>{{ "Payment Modes" }}</h2>
          </div>
          <!-- <div class="col-auto mb-2">
            <a
              class="btn btn-sm btn-light-primary"
              [routerLink]="['/panel/add_payment_mode']"

            >
          </div> -->
        </div>
      </div>
      <div class="col-auto">
        <div class="row align-items-center">
          <div class="col-auto mb-2">
            <div class="form-feild page-heading-search-field mb-0">
              <div class="field-icon">
                <input
                  type="text"
                  class="form-control form-c ontrol-sm form-control-shadow"
                  placeholder="Search..."
                  [(ngModel)]="searchTerm"
                  (input)="onPaymentModeSearch()"
                />
                <div class="icon">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="table-responsive overflow-behaviour">
    <table class="table table-list-data table-hover">
      <thead class="bg-light">
        <tr>
          <th scope="col" (click)="sortColumn('name')">
            {{ "Payment Mode" }}
            <span
              class="cursor-pointer"
              [ngClass]="
                sortOrder.direction === 'asc' ? 'asc-icon' : 'desc-icon'
              "
            >
              &#x2191;&#x2193;
            </span>
          </th>

          <th scope="col" (click)="sortColumn('isActive')">
            {{ "Status" }}
            <span
              class="cursor-pointer"
              [ngClass]="
                sortOrder.direction === 'asc' ? 'asc-icon' : 'desc-icon'
              "
            >
              &#x2191;&#x2193;
            </span>
          </th>

          <th scope="col" (click)="sortColumn('updatedAt')">
            {{ "Updated On" }}
            <span
              class="cursor-pointer"
              [ngClass]="
                sortOrder.direction === 'asc' ? 'asc-icon' : 'desc-icon'
              "
            >
              &#x2191;&#x2193;
            </span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let payMode of paymentModeList; let i = index">
          <td>{{ payMode?.name }}</td>

          <td>
            <div class="form-check form-switch form-switch-2">
              <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              id="Status_id2"
              [(ngModel)]="payMode.isActive"
              (change)="onUserStatusChange(payMode)"
            />
            
            </div>
          </td>

          <td>
            {{ payMode?.updatedAt }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
