<!-- country-risk-management.component.html -->
<div class="content">
    <div class="page-heading">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto">
          <div class="row align-items-center">
            <div class="col-auto mb-2">
              <h2>Risk Management</h2>
            </div>
            <div class="col-auto mb-2">
              <button class="btn btn-sm btn-light-primary"  (click)="openAddModal()">
                <i class="fa-solid fa-plus"></i> New Risk
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <div class="table-responsive overflow-behaviour">
      <table class="table table-list-data table-hover">
        <thead class="bg-light">
          <tr>
            
            <th><b>Risk</b></th>
            <th><b>Status</b></th>
           
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let risk of riskList">
            <td>{{ risk.name }}</td>
            <td>
                <div class="form-check form-switch form-switch-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    
                    [checked]="risk.isActive"
                  />
                </div>
              </td>
       
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <div class="modal-container" *ngIf="isAddModalOpen">
    <div class="modal-backdrop" (click)="closeAddModal()"></div>
    <div class="modal-content">
     <div class="modal-header">
      <h5 class="modal-title">Add New Risk</h5>
      <button
    type="button"
    class="btn-close"
    (click)="closeAddModal()"
    aria-label="Close"
  ></button>
     </div>
      <form [formGroup]="addRiskForm">
       
        <div class="form-group" style="padding: 6px 15px;">
          <label class="form-label">Risk</label>
          <input type="text" id="name" class="form-control" formControlName="name">
        </div>

        <div class="form-group form-switch" style="padding: 6px 15px; display: flex; align-items: center;">
            <label for="isActive" class="form-check-label">Status</label>
            <input type="checkbox" id="isActive" class="form-check-input ms-4" formControlName="isActive">
          </div>
       
        <div style="text-align:center; margin-top: 15px; margin-bottom: 10px;">
          <button class="btn btn-primary custom-button" (click)="addRisk()">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
